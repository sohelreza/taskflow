name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Install Cypress binary
        run: npx cypress install
        working-directory: client

      - name: Build server
        run: npm run build --workspace=server

      - name: Create server test env
        run: |
          cat > server/.env.test <<EOF
          PORT=4000
          GITHUB_OAUTH_CLIENT_ID=ci-test-client-id
          GITHUB_OAUTH_CLIENT_SECRET=ci-test-client-secret
          COOKIE_SECRET=ci_test_cookie_secret_at_least_32_characters_long_placeholder
          FRONTEND_URL=http://localhost:5173
          TEST_MODE=true
          EOF

      - name: Start server
        run: npm run dev:test --workspace=server &
        env:
          NODE_ENV: test

      - name: Start client
        run: npm run dev --workspace=client &

      - name: Wait for services
        run: npx wait-on http://localhost:5173 http://localhost:4000/health --timeout 120000

      - name: Run Cypress tests
        run: npx cypress run
        working-directory: client

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: client/cypress/screenshots
          if-no-files-found: ignore
